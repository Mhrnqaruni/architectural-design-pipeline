name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install fonts for the drawing renderer
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends fonts-dejavu-core

      - name: Install
        run: pip install -e ".[dev]"

      - name: Design rules and tests
        run: pytest -q

      - name: Drawing set (rule checks first, DXF audit last)
        run: archdesign drawings

      - name: 3D model
        run: archdesign model

      - name: Keep the outputs
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: concept-package
          path: |
            output/drawings/concept-drawings.pdf
            output/drawings/model_1to1_metres.dxf
            output/model/index.html
          retention-days: 14
